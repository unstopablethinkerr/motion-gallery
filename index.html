<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8E2F8">
<title>Motion Gallery</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#E8E2F8; --ink:#231C4B; --edge:#F1ECFF; --accent:#FF4F8B; --sun:#FFD23F; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:max(22px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
    min-height:100vh; min-height:100dvh;
  }
  body.locked{overflow:hidden}
  .wrap{max-width:1240px;margin:0 auto}

  header{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;justify-content:space-between;margin-bottom:26px}
  h1{margin:0;font-size:clamp(32px,6vw,56px);font-weight:800;letter-spacing:-.03em;line-height:1}
  .sub{margin:8px 0 0;font-size:16px;opacity:.8;max-width:56ch}
  .search{display:grid;gap:6px;min-width:min(100%,280px)}
  .search label{font-size:13px;font-weight:600}
  .search input{
    font:inherit;font-size:16px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;
    padding:9px 18px;outline:none;box-shadow:4px 4px 0 var(--ink);
  }
  .search input:focus-visible{box-shadow:4px 4px 0 var(--accent)}
  #count{font-size:13px;opacity:.7;margin:0 0 14px}

  #grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
  .card{
    display:flex;flex-direction:column;background:#fff;color:inherit;text-decoration:none;
    border:3px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover,.card:focus-visible{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--accent);outline:none}
  .card[hidden]{display:none}
  .thumb{position:relative;aspect-ratio:16/9;background:var(--edge);border-bottom:3px solid var(--ink);overflow:hidden}
  .thumb iframe{position:absolute;left:0;top:0;border:0;background:#fff;transform-origin:0 0;pointer-events:none}
  .thumb .play{
    position:absolute;right:10px;bottom:10px;background:var(--ink);color:#fff;border-radius:999px;
    font-size:12px;font-weight:600;padding:3px 11px;opacity:0;transition:opacity .15s;
  }
  .card:hover .play,.card:focus-visible .play{opacity:1}
  .body{padding:14px 16px 16px;display:grid;gap:6px}
  .body h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
  .body p{margin:0;font-size:14px;line-height:1.4;opacity:.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .tags span{font-size:12px;font-weight:600;border:2px solid var(--ink);border-radius:999px;padding:1px 9px}
  #empty{text-align:center;font-size:16px;opacity:.75;padding:60px 0}
  footer{margin-top:36px;text-align:center;font-size:13px;opacity:.65}

  /* full-screen viewer */
  #viewer{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--ink)}
  #viewer[hidden]{display:none}
  .vbar{
    display:flex;align-items:center;gap:10px;color:#fff;
    padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));
  }
  .vtitle{flex:1;min-width:0;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vtitle small{font-weight:400;opacity:.7;margin-left:8px;font-size:13px}
  .vbtn{
    flex:none;display:grid;place-items:center;min-width:44px;height:44px;border-radius:999px;border:2px solid #fff;
    background:transparent;color:#fff;font:inherit;font-size:20px;line-height:1;text-decoration:none;cursor:pointer;
  }
  .vbtn:hover,.vbtn:focus-visible{background:#fff;color:var(--ink);outline:none}
  #frame{flex:1;width:100%;border:0;background:#fff;min-height:0}

  @media (max-width:560px){
    body{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
    header{margin-bottom:18px}
    #grid{gap:18px}
    .vtitle small{display:none}
    .vbtn{min-width:42px;height:42px}
  }
  @media (hover:none){ .thumb .play{opacity:1} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="siteTitle">Motion Gallery</h1>
      <p class="sub" id="siteSub"></p>
    </div>
    <div class="search">
      <label for="q">Search animations</label>
      <input id="q" type="search" placeholder="Type a name or tag" autocomplete="off">
    </div>
  </header>

  <p id="count" aria-live="polite"></p>
  <main id="grid"></main>
  <p id="empty" hidden>No animation matches that search.</p>
  <footer id="siteFooter"></footer>
</div>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Animation viewer" hidden>
  <div class="vbar">
    <button class="vbtn" id="vclose" aria-label="Close viewer" title="Close (Esc)">&#10005;</button>
    <div class="vtitle" id="vtitle"></div>
    <button class="vbtn" id="vprev" aria-label="Previous animation" title="Previous (Left arrow)">&#8249;</button>
    <button class="vbtn" id="vnext" aria-label="Next animation" title="Next (Right arrow)">&#8250;</button>
    <button class="vbtn" id="vfull" aria-label="Full screen" title="Full screen">&#9974;</button>
    <a class="vbtn" id="vopen" target="_blank" rel="noopener" aria-label="Open in a new tab" title="Open in a new tab">&#8599;</a>
  </div>
  <iframe id="frame" title="Animation" allow="fullscreen; autoplay" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
</div>

<script>
/* =====================================================================
   EDIT THIS PART ONLY
   One object per animation:
     title        name shown on the card              (required)
     file         path to the html file               (required)
     description  one or two sentences                (optional)
     tags         ["css", "svg", ...] used for search (optional)
     w, h         design size in px, default 1280x720 (optional)
                  Set these for non-16:9 animations, e.g. w:1080, h:1920
   Add a new line, save, refresh. That's it.
   ===================================================================== */
const SITE = {
  title: 'Motion Gallery',
  subtitle: 'Motion design animations made with Claude. Click any card to watch it full screen.',
  footer: 'Made with Claude'
};

const ANIMATIONS = [
  { title: 'Orbit',         file: 'animations/1.html', description: 'Three rings of pulsing dots circling a quiet centre.',         tags: ['css', 'loop'] },
  { title: 'Letter Rise',   file: 'animations/2.html', description: 'Kinetic type: letters slide up, hold, then exit the other way.', tags: ['typography', 'css'] },
  { title: 'Tide',          file: 'animations/3.html', description: 'Layered sine waves drawn live on a canvas.',                    tags: ['canvas', 'javascript'] },
  { title: 'Creeto',                file: 'animations/Creeto.html' },
  { title: 'Dunning-Kruger',        file: 'animations/dunning-kruger.html' },
  { title: 'Synaptic Pruning Reel', file: 'animations/synaptic-pruning-reel.html' }
  // Add description and tags to any entry above, e.g.:
  // { title: 'Creeto', file: 'animations/Creeto.html', description: 'One short sentence.', tags: ['brand', 'intro'] },
  // Vertical reel? Add  w: 1080, h: 1920  so the preview is scaled and centred correctly.
];
/* ===================================================================== */

const $ = id => document.getElementById(id);
const grid = $('grid'), q = $('q'), count = $('count'), empty = $('empty');
const viewer = $('viewer'), frame = $('frame');
const DEFAULT_W = 1280, DEFAULT_H = 720;

document.title = SITE.title;
$('siteTitle').textContent = SITE.title;
$('siteSub').textContent = SITE.subtitle || '';
$('siteFooter').textContent = SITE.footer || '';

/* ---------- cards ---------- */
const visible = new Set();
let viewing = false;

const cards = ANIMATIONS.map((a, i) => {
  const w = a.w || DEFAULT_W, h = a.h || DEFAULT_H;
  const el = document.createElement('a');
  el.className = 'card'; el.href = a.file; el.dataset.i = i;
  el.setAttribute('aria-label', 'Open ' + a.title);

  const thumb = document.createElement('div'); thumb.className = 'thumb';
  const f = document.createElement('iframe');
  f.title = ''; f.tabIndex = -1; f.setAttribute('aria-hidden', 'true'); f.setAttribute('scrolling', 'no');
  f.setAttribute('sandbox', 'allow-scripts allow-same-origin');
  f.style.width = w + 'px'; f.style.height = h + 'px';
  const play = document.createElement('span'); play.className = 'play'; play.textContent = 'Watch';
  thumb.append(f, play);

  const body = document.createElement('div'); body.className = 'body';
  const t = document.createElement('h2'); t.textContent = a.title; body.append(t);
  if (a.description){ const p = document.createElement('p'); p.textContent = a.description; body.append(p); }
  if (a.tags && a.tags.length){
    const tg = document.createElement('div'); tg.className = 'tags';
    a.tags.forEach(x => { const s = document.createElement('span'); s.textContent = x; tg.append(s); });
    body.append(tg);
  }
  el.append(thumb, body); grid.append(el);

  el._frame = f; el._file = a.file; el._thumb = thumb; el._w = w; el._h = h;
  el._text = [a.title, a.description || '', (a.tags || []).join(' ')].join(' ').toLowerCase();

  el.addEventListener('click', e => {
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;   // let "open in new tab" work
    e.preventDefault(); openAt(i, true);
  });
  return el;
});

/* scale the live preview to the card width, centred (letterboxed if not 16:9) */
const fit = card => {
  const tw = card._thumb.clientWidth, th = card._thumb.clientHeight;
  if (!tw) return;
  const s = Math.min(tw / card._w, th / card._h);
  const ox = (tw - card._w * s) / 2, oy = (th - card._h * s) / 2;
  card._frame.style.transform = `translate(${ox}px,${oy}px) scale(${s})`;
};
const ro = new ResizeObserver(es => es.forEach(e => fit(e.target.closest('.card'))));
cards.forEach(c => ro.observe(c._thumb));

/* only run previews that are on screen (keeps phones cool) */
const sync = card => {
  const want = visible.has(card) && !viewing && !card.hidden;
  const on = card._frame.dataset.on === '1';
  if (want && !on){ card._frame.src = card._file; card._frame.dataset.on = '1'; }
  else if (!want && on){ card._frame.src = 'about:blank'; card._frame.dataset.on = '0'; }
};
const io = new IntersectionObserver(es => es.forEach(e => {
  e.isIntersecting ? visible.add(e.target) : visible.delete(e.target); sync(e.target);
}), { rootMargin: '200px' });
cards.forEach(c => io.observe(c));

/* ---------- search ---------- */
function applyFilter(){
  const term = q.value.trim().toLowerCase();
  let n = 0;
  cards.forEach(c => { c.hidden = term && !c._text.includes(term) ? true : false; if (!c.hidden) n++; sync(c); });
  count.textContent = n + (n === 1 ? ' animation' : ' animations') + (term ? ' found' : '');
  empty.hidden = n !== 0;
}
q.addEventListener('input', applyFilter);
applyFilter();

/* ---------- viewer ---------- */
let current = -1, lastCard = null;
function openAt(i, push){
  const a = ANIMATIONS[i]; if (!a) return;
  const wasOpen = current !== -1;
  current = i; lastCard = cards[i];
  $('vtitle').textContent = a.title;
  if (a.description){ const s = document.createElement('small'); s.textContent = a.description; $('vtitle').append(s); }
  $('vopen').href = a.file;
  frame.title = a.title; frame.src = a.file;
  viewer.hidden = false; document.body.classList.add('locked');
  viewing = true; cards.forEach(sync);
  const hash = '#' + (i + 1);
  if (push && !wasOpen) history.pushState(null, '', hash); else history.replaceState(null, '', hash);
  if (!wasOpen) $('vclose').focus();
}
function closeViewer(){
  if (current === -1) return;
  current = -1; frame.src = 'about:blank'; viewer.hidden = true; document.body.classList.remove('locked');
  if (document.fullscreenElement) document.exitFullscreen();
  viewing = false; cards.forEach(sync);
  history.replaceState(null, '', location.pathname + location.search);
  if (lastCard) lastCard.focus({ preventScroll: true });
}
const step = d => openAt((current + d + ANIMATIONS.length) % ANIMATIONS.length, false);

$('vclose').onclick = closeViewer;
$('vprev').onclick = () => step(-1);
$('vnext').onclick = () => step(1);
if (document.fullscreenEnabled) $('vfull').onclick = () => frame.requestFullscreen && frame.requestFullscreen();
else $('vfull').hidden = true;

addEventListener('keydown', e => {
  if (current === -1) return;
  if (e.key === 'Escape') closeViewer();
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
});

/* deep links: index.html#2 opens the second animation */
function route(){
  const m = /^#(\d+)$/.exec(location.hash), i = m ? +m[1] - 1 : -1;
  if (i >= 0 && i < ANIMATIONS.length){ if (i !== current) openAt(i, false); }
  else closeViewer();
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
