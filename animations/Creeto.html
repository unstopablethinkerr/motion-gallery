  const film = Creeto.create(cv), T = film.T;
  film.chapters.forEach(c => { if (c > 0) { const i = document.createElement('i'); i.style.left = (c / T * 100) + '%'; $('ticks').appendChild(i); } });
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = reduce ? 1.1 : 0, playing = !reduce, dirty = true, last = performance.now(), rec = null, idleT = 0;
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  function ui() {
    ico.innerHTML = playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M6 4l14 8-14 8z"/>';
    scrub.value = Math.round(t / T * 30000); scrub.style.setProperty('--p', (t / T * 100) + '%'); timeEl.textContent = fmt(t) + ' / ' + fmt(T);
  }
  function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); if (playing) idleT = setTimeout(() => document.body.classList.add('idle'), 2600); }
  function tick(now) {
    const dt = Math.min(.25, (now - last) / 1000); last = now;
    if (playing) { t += dt; dirty = true; if (t >= T) { t = T; playing = false; if (rec) stopRec(); wake(); } }
    if (dirty) { film.render(t); ui(); dirty = false; }
    requestAnimationFrame(tick);
  }
  function toggle() { if (t >= T) t = 0; playing = !playing; dirty = true; wake(); }
  playBtn.onclick = toggle;
  scrub.oninput = () => { t = scrub.value / 30000 * T; dirty = true; wake(); };
  $('fs').onclick = () => { const d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen(); };
  addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT' && e.target.type === 'range' && (e.key === ' ')) e.preventDefault();
    if (e.key === ' ' && !(e.target && e.target.tagName === 'BUTTON')) { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight' && !(e.target && e.target.tagName === 'INPUT')) { t = Math.min(T, t + 1); dirty = true; wake(); }
    else if (e.key === 'ArrowLeft' && !(e.target && e.target.tagName === 'INPUT')) { t = Math.max(0, t - 1); dirty = true; wake(); }
    else if (e.key === 'r' || e.key === 'R') { t = 0; playing = true; dirty = true; wake(); }
    else if (e.key === 'f' || e.key === 'F') $('fs').onclick();
    wake();
  });
  ['mousemove', 'pointerdown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));

  // swap in a real dashboard screenshot
  function useImage(file) { if (!file || !file.type.startsWith('image/')) return; const img = new Image(); img.onload = () => { film.setUserImage(img); dirty = true; }; img.src = URL.createObjectURL(file); }
  $('shot').onclick = () => $('file').click();
  $('file').onchange = e => useImage(e.target.files[0]);
  let dragN = 0;
  addEventListener('dragenter', e => { e.preventDefault(); dragN++; document.body.classList.add('dragging'); });
  addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if (!dragN) document.body.classList.remove('dragging'); });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); dragN = 0; document.body.classList.remove('dragging'); useImage(e.dataTransfer.files[0]); });

  // real-time WebM recording of the canvas
  function startRec() {
    if (!cv.captureStream || !window.MediaRecorder) { recBtn.textContent = 'Recording not supported'; recBtn.disabled = true; return; }
    const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
    const stream = cv.captureStream(30), chunks = [];
    const mr = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 14e6 } : {});
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => { const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); $('outv').src = url; $('dl').href = url; $('out').hidden = false; };
    t = 0; playing = true; dirty = true; mr.start(250); rec = mr; recBtn.classList.add('on'); recBtn.textContent = 'Recording… click to stop'; wake();
  }
  function stopRec() { if (!rec) return; const r = rec; rec = null; setTimeout(() => r.state !== 'inactive' && r.stop(), 300); recBtn.classList.remove('on'); recBtn.textContent = 'Record WebM'; }
  recBtn.onclick = () => rec ? stopRec() : startRec();
  $('closeout').onclick = () => { $('out').hidden = true; $('outv').pause(); };

  $('load').classList.add('done');
  wake(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
