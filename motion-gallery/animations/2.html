<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Rise</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#FFD23F;overflow:hidden}
  main{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:3vmin;
       font-family:"Bricolage Grotesque",system-ui,sans-serif;color:#231C4B}
  .word{display:flex}
  .l{display:inline-block;overflow:hidden;line-height:1.05;font-size:20vmin;font-weight:800;letter-spacing:-.03em}
  .l span{display:inline-block;animation:rise 4.4s cubic-bezier(.2,.9,.2,1) infinite;animation-delay:calc(var(--i) * .09s)}
  .bar{height:1.4vmin;width:60vmin;max-width:80vw;background:#231C4B;border-radius:99px;transform-origin:left;animation:wipe 4.4s cubic-bezier(.7,0,.2,1) infinite}
  .sub{margin:0;font-size:4vmin;font-weight:800;letter-spacing:.02em;animation:fade 4.4s ease infinite}
  @keyframes rise{
    0%{transform:translateY(115%) rotate(10deg)}
    16%,68%{transform:none}
    84%,100%{transform:translateY(-115%) rotate(-10deg)}
  }
  @keyframes wipe{0%{transform:scaleX(0)}20%,68%{transform:scaleX(1);transform-origin:left}69%{transform-origin:right}86%,100%{transform:scaleX(0);transform-origin:right}}
  @keyframes fade{0%,18%{opacity:0;transform:translateY(1.5vmin)}30%,66%{opacity:1;transform:none}80%,100%{opacity:0}}
</style>
</head>
<body>
<main>
  <div class="word" id="word" aria-label="Motion"></div>
  <div class="bar"></div>
  <p class="sub">motion design</p>
</main>
<script>
  const w = document.getElementById('word');
  [...'MOTION'].forEach((ch, i) => {
    const l = document.createElement('div'); l.className = 'l';
    const s = document.createElement('span'); s.textContent = ch; s.style.setProperty('--i', i);
    l.appendChild(s); w.appendChild(l);
  });
</script>
</body>
</html>
